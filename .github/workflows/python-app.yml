name: Python CI

on:
  push:
    branches: [main, "fix/pytest-collection"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install bcrypt pytest
      - name: Run tests
        run: pytest -v
